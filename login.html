<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Apexearn</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 24px; color: #38bdf8; }
        .input-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 16px; }
        input:focus { outline: none; border-color: #38bdf8; }
        .btn { width: 100%; padding: 12px; background: #38bdf8; border: none; border-radius: 6px; color: #0f172a; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn:hover { background: #0ea5e9; }
        .footer-text { text-align: center; margin-top: 16px; font-size: 14px; color: #94a3b8; }
        .footer-text a { color: #38bdf8; text-decoration: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Apexearn Login</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>Mobile Number or Gmail</label>
                <input type="text" id="loginIdentifier" required placeholder="আপনার নম্বর বা জিমেইল দিন">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" required placeholder="********">
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        <div class="footer-text">
            Don't have an account? <a href="register.html">Register here</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const inputId = document.getElementById('loginIdentifier').value;
            const inputPass = document.getElementById('loginPassword').value;

            const savedUserJSON = localStorage.getItem('apexUser');
            if (!savedUserJSON) {
                alert('কোনো অ্যাকাউন্ট পাওয়া যায়নি! আগে রেজিস্ট্রেশন করুন।');
                window.location.href = 'register.html';
                return;
            }

            const savedUser = JSON.parse(savedUserJSON);

            if (savedUser.identifier === inputId && savedUser.password === inputPass) {
                alert('লগইন সফল হয়েছে!');
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'index.html';
            } else {
                alert('ভুল নম্বর/জিমেইল অথবা পাসওয়ার্ড!');
            }
        });
    </script>

</body>
</html>
