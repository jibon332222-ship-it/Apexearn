<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Apexearn</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 24px; color: #38bdf8; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 15px; }
        input:focus { outline: none; border-color: #38bdf8; }
        .btn { width: 100%; padding: 12px; background: #38bdf8; border: none; border-radius: 6px; color: #0f172a; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn:hover { background: #0ea5e9; }
        .footer-text { text-align: center; margin-top: 16px; font-size: 14px; color: #94a3b8; }
        .footer-text a { color: #38bdf8; text-decoration: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Create Account</h2>
        <form id="regForm">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="name" required placeholder="আপনার নাম লিখুন">
            </div>
            <div class="input-group">
                <label>Mobile Number or Gmail</label>
                <input type="text" id="identifier" required placeholder="নম্বর অথবা জিমেইল দিন">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="********">
            </div>
            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" required placeholder="********">
            </div>
            <button type="submit" class="btn">Register</button>
        </form>
        <div class="footer-text">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>

    <script>
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const identifier = document.getElementById('identifier').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert('দুঃখিত! পাসওয়ার্ড দুটি একরকম হয়নি।');
                return;
            }

            const userData = {
                name: name,
                identifier: identifier,
                password: password
            };

            localStorage.setItem('apexUser', JSON.stringify(userData));
            
            alert('রেজিস্ট্রেশন সফল হয়েছে! এখন লগইন করুন।');
            window.location.href = 'login.html';
        });
    </script>

</body>
</html>
