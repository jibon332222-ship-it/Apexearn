<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Admin Panel - Apex Earn</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0f19; color: #fff; padding: 20px; }
        h1 { color: #00ff88; text-align: center; margin-bottom: 25px; font-size: 24px; }
        .card { background: #131b2e; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #1e293b; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h3 { margin-bottom: 15px; color: #f97316; font-size: 18px; }
        .btn { padding: 10px 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-green { background: #00ff88; color: #000; }
        .btn-red { background: #ff4757; color: #fff; }
        .btn-blue { background: #0088cc; color: #fff; width: 100%; margin-top: 10px; }
        .item-box { background: #0b0f19; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
        input, select { width: 100%; padding: 12px; background: #0b0f19; border: 1px solid #1e293b; color: #fff; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
        .form-group { margin-bottom: 10px; }
        label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

    <h1>Apex Earn Admin Panel</h1>

    <!-- Specific User Balance Management -->
    <div class="card">
        <h3>🎯 নির্দিষ্ট ইউজারের ব্যালেন্স ম্যানেজ করুন</h3>
        <div class="form-group">
            <label>ইউজারের ফোন নম্বর বা ইউজার আইডি:</label>
            <input type="text" id="targetUserPhone" placeholder="যেমন: 01712345678">
        </div>
        <div class="form-group">
            <label>টাকার পরিমাণ:</label>
            <input type="number" id="targetAmount" placeholder="টাকার পরিমাণ লিখুন">
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-green" style="flex: 1;" onclick="adminAddBalance()">টাকা যোগ করুন (+)</button>
            <button class="btn btn-red" style="flex: 1;" onclick="adminCutBalance()">টাকা কেটে নিন (-)</button>
        </div>
    </div>

    <!-- Pending Withdraw Requests -->
    <div class="card">
        <h3>📥 পেন্ডিং উইথড্র রিকোয়েস্টসমূহ</h3>
        <div id="withdrawList">কোনো পেন্ডিং উইথড্র নেই</div>
    </div>

    <!-- System Broadcast / Notice Update -->
    <div class="card">
        <h3>📢 নোটিশ বার আপডেট করুন</h3>
        <input type="text" id="noticeText" placeholder="নতুন নোটিশ লিখুন...">
        <button class="btn btn-blue" onclick="updateNotice()">নোটিশ পরিবর্তন করুন</button>
    </div>

    <script>
        // সেন্ট্রাল ডাটাবেজ হ্যান্ডਲার (LocalStorage ভিত্তিক মাল্টি-ইউজার সিমুলেশন)
        function getDatabase() {
            let db = localStorage.getItem('apexDatabase');
            if (!db) {
                return { users: {}, pendingWithdraws: [], notice: "" };
            }
            return JSON.parse(db);
        }

        function saveDatabase(db) {
            localStorage.setItem('apexDatabase', JSON.stringify(db));
        }

        function refreshAdminPanel() {
            let db = getDatabase();
            let listContainer = document.getElementById('withdrawList');
            
            if (!db.pendingWithdraws || db.pendingWithdraws.length === 0) {
                listContainer.innerHTML = "<p style='color: #94a3b8; text-align: center;'>কোনো পেন্ডিং উইথড্র নেই।</p>";
                return;
            }

            let html = '';
            db.pendingWithdrawsforEach((item, index) => {
                // Fix for safe iteration
            });

            // Re-writing loop properly
            html = '';
            for (let i = 0; i < db.pendingWithdraws.length; i++) {
                let item = db.pendingWithdraws[i];
                html += `
                    <div class="item-box">
                        <div>
                            <strong>নম্বর:</strong> ${item.phone} <br>
                            <strong>মেথড:</strong> ${item.method} <br>
                            <strong>অ্যাকাউন্ট:</strong> ${item.account} <br>
                            <strong>পরিমাণ:</strong> <span style="color:#00ff88;">৳${item.amount}</span>
                        </div>
                        <div>
                            <button class="btn btn-green" onclick="approveWithdraw(${i})">এপ্রুভ</button>
                            <button class="btn btn-red" onclick="rejectWithdraw(${i})" style="margin-top:5px;">বাতিল</button>
                        </div>
                    </div>
                `;
            }
            listContainer.innerHTML = html;
        }

        // নির্দিষ্ট ইউজারের ব্যালেন্স প্লাস করা
        function adminAddBalance() {
            let phone = document.getElementById('targetUserPhone').value.trim();
            let amount = Number(document.getElementById('targetAmount').value);

            if (!phone || !amount || amount <= 0) {
                alert("দয়া করে সঠিক ফোন নম্বর এবং টাকার পরিমাণ লিখুন!");
                return;
            }

            let db = getDatabase();
            if (!db.users[phone]) {
                db.users[phone] = { balance: 0, history: [] };
            }

            db.users[phone].balance += amount;
            db.users[phone].history.unshift({
                title: `ডিপোজিট এপ্রুভড`,
                amount: `+৳${amount}`,
                date: new Date().toLocaleString('bn-BD')
            });

            saveDatabase(db);
            alert(`সফল! ${phone} নম্বরের অ্যাকাউন্টে ৳${amount} যোগ করা হয়েছে।`);
            document.getElementById('targetUserPhone').value = '';
            document.getElementById('targetAmount').value = '';
        }

        // নির্দিষ্ট ইউজারের ব্যালেন্স মাইনাস করা
        function adminCutBalance() {
            let phone = document.getElementById('targetUserPhone').value.trim();
            let amount = Number(document.getElementById('targetAmount').value);

            if (!phone || !amount || amount <= 0) {
                alert("দয়া করে সঠিক ফোন নম্বর এবং টাকার পরিমাণ লিখুন!");
                return;
            }

            let db = getDatabase();
            if (!db.users[phone]) {
                alert("এই নম্বরের কোনো ইউজার ডাটাবেজে পাওয়া যায়নি!");
                return;
            }

            if (db.users[phone].balance < amount) {
                alert("ইউজারের অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই!");
                return;
            }

            db.users[phone].balance -= amount;
            db.users[phone].history.unshift({
                title: `অ্যাডমিন কর্তন`,
                amount: `-৳${amount}`,
                date: new Date().toLocaleString('bn-BD')
            });

            saveDatabase(db);
            alert(`সফল! ${phone} নম্বরের অ্যাকাউন্ট থেকে ৳${amount} কেটে নেওয়া হয়েছে।`);
            document.getElementById('targetUserPhone').value = '';
            document.getElementById('targetAmount').value = '';
        }

        // উইথড্র এপ্রুভ করলে অটো ব্যালেন্স কেটে নেওয়া এবং হিস্টরি আপডেট করা
        function approveWithdraw(index) {
            let db = getDatabase();
            let req = db.pendingWithdraws[index];

            if (!db.users[req.phone] || db.users[req.phone].balance < req.amount) {
                alert("ইউজারের অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই!");
                return;
            }

            // ব্যালেন্স কাটা
            db.users[req.phone].balance -= req.amount;
            
            // ইউজারের হিস্টরিতে যোগ করা
            db.users[req.phone].history.unshift({
                title: `উত্তোলন সফল (${req.method})`,
                amount: `-৳${req.amount}`,
                date: new Date().toLocaleString('bn-BD')
            });

            // পেন্ডিং লিস্ট থেকে সরিয়ে দেওয়া
            db.pendingWithdraws.splice(index, 1);
            saveDatabase(db);

            alert("উইথড্র সফলভাবে এপ্রুভ করা হয়েছে!");
            refreshAdminPanel();
        }

        // উইথড্র বাতিল করা
        function rejectWithdraw(index) {
            let db = getDatabase();
            let req = db.pendingWithdraws[index];

            if (db.users[req.phone]) {
                db.users[req.phone].history.unshift({
                    title: `উত্তোলন বাতিল (${req.method})`,
                    amount: `৳${req.amount}`,
                    date: new Date().toLocaleString('bn-BD')
                });
            }

            db.pendingWithdraws.splice(index, 1);
            saveDatabase(db);
            alert("উইথড্র রিকোয়েস্ট বাতিল করা হয়েছে।");
            refreshAdminPanel();
        }

        function updateNotice() {
            let notice = document.getElementById('noticeText').value.trim();
            if(!notice) return;
            localStorage.setItem('siteNotice', notice);
            alert("নোটিশ আপডেট সফল হয়েছে!");
            document.getElementById('noticeText').value = '';
        }

        window.onload = refreshAdminPanel;
    </script>
</body>
</html>
